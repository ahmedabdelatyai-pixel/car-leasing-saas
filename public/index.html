<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>مطعم ضجة 🔥 | البوابة الرئيسية والنظام الداخلي</title>
  
  <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      font-family: 'Cairo', sans-serif;
      background-color: #0b0f19;
      color: #f8fafc;
      -webkit-tap-highlight-color: transparent;
    }
    .glow-orange {
      box-shadow: 0 0 35px rgba(249, 115, 22, 0.4);
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

  <!-- Ambient Glow Backgrounds -->
  <div class="fixed top-1/4 -right-20 w-80 h-80 rounded-full bg-orange-600/15 blur-3xl pointer-events-none"></div>
  <div class="fixed bottom-1/4 -left-20 w-80 h-80 rounded-full bg-amber-600/15 blur-3xl pointer-events-none"></div>

  <div class="w-full max-w-sm space-y-6 relative z-10 text-center">
    
    <!-- Restaurant Logo & Title -->
    <div class="space-y-3">
      <div class="w-20 h-20 mx-auto rounded-3xl bg-gradient-to-tr from-amber-500 to-orange-600 flex items-center justify-center text-4xl shadow-2xl glow-orange animate-bounce">
        🔥
      </div>
      <div>
        <h1 class="text-2xl font-black text-white tracking-tight">مطعم ضجة</h1>
        <p class="text-xs text-orange-400 font-bold mt-1">طعم يعمل ضجة! 🔥 أقوى برجر وسندوتشات دليفري وتيك واي</p>
      </div>
    </div>

    <!-- CUSTOMER ORDER ONLINE HERO BUTTON -->
    <a href="order.html" class="w-full h-14 bg-gradient-to-r from-orange-600 via-amber-600 to-orange-500 hover:from-orange-500 hover:to-amber-500 text-white font-black text-sm rounded-2xl flex items-center justify-center gap-3 shadow-2xl glow-orange active:scale-[0.98] transition-all">
      <span class="text-xl">🍔</span>
      <span>اطلب أونلاين الآن (دليفري / تيك واي) 🚀</span>
    </a>

    <div class="flex items-center gap-2 text-slate-500 text-xs">
      <div class="flex-1 h-px bg-white/10"></div>
      <span>أو تسجيل دخول الإدارة والمطبخ</span>
      <div class="flex-1 h-px bg-white/10"></div>
    </div>

    <!-- STAFF & MANAGER LOGIN CARD -->
    <div class="bg-[#111827]/80 backdrop-blur-2xl border border-white/10 rounded-3xl p-6 shadow-2xl text-right space-y-4">
      <h2 class="text-xs font-black text-slate-200 border-b border-white/5 pb-3 text-center flex items-center justify-center gap-2">
        <span>🔐</span> دخول المطبخ والكاشير والإدارة
      </h2>

      <form id="loginForm" onsubmit="handleStaffLogin(event)" class="space-y-3">
        <div class="space-y-1">
          <label class="text-[10px] text-slate-400 block font-semibold">البريد الإلكتروني أو اسم المستخدم</label>
          <input type="text" id="emailInput" required value="admin@dajja.com" placeholder="admin@dajja.com" 
                 class="w-full h-10 px-3 rounded-xl text-xs bg-white/5 border border-white/10 text-white focus:border-orange-500 focus:outline-none font-mono">
        </div>

        <div class="space-y-1">
          <label class="text-[10px] text-slate-400 block font-semibold">كلمة المرور</label>
          <input type="password" id="passwordInput" required value="123456" placeholder="••••••••" 
                 class="w-full h-10 px-3 rounded-xl text-xs bg-white/5 border border-white/10 text-white focus:border-orange-500 focus:outline-none font-mono">
        </div>

        <div class="pt-2">
          <button type="submit" id="submitBtn" class="w-full h-11 bg-white/10 hover:bg-orange-600 hover:text-white text-slate-200 font-black text-xs rounded-xl border border-white/10 transition-all flex items-center justify-center gap-2">
            <span>دخول لوحة التحكم</span>
            <span>⚡</span>
          </button>
        </div>
      </form>

      <p class="text-[10px] text-slate-500 text-center pt-2">
        حساب تجريبي افتراضي: <span class="text-orange-400 font-mono">admin@dajja.com</span> | الرمز: <span class="text-orange-400 font-mono">123456</span>
      </p>
    </div>

  </div>

  <script>
    async function handleStaffLogin(e) {
      e.preventDefault();
      const email = document.getElementById('emailInput').value.trim();
      const password = document.getElementById('passwordInput').value.trim();
      const btn = document.getElementById('submitBtn');

      btn.disabled = true;
      btn.innerHTML = '🔄 جاري التحقق...';

      try {
        const res = await fetch('/api/v1/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Login failed');

        localStorage.setItem('auth_token', data.token);
        localStorage.setItem('auth_user', JSON.stringify(data.user));

        btn.innerHTML = 'تم الدخول بنجاح! 🎉';
        setTimeout(() => {
          window.location.href = 'dajja_dashboard.html';
        }, 600);

      } catch (err) {
        alert(`فشل تسجيل الدخول: ${err.message}`);
        btn.disabled = false;
        btn.innerHTML = 'دخول لوحة التحكم ⚡';
      }
    }
  </script>
</body>
</html>
