<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>لوحة تحكم مدير النظام</title>
  <script src="https://cdn.tailwindcss.com/3.4.15"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-canvas: #F5F3EE;
      --bg-surface: #FFFFFF;
      --border-stone: #D1CBBF;
      --text-main: #111827;
      --text-muted: #374151;
    }
    body.dark-theme, [data-theme="dark"], html[data-theme="dark"] body {
      --bg-canvas: #0F1412;
      --bg-surface: #18221D;
      --border-stone: #2F3E37;
      --text-main: #FFFFFF;
      --text-muted: #E2E8F0;
    }
    body {
      font-family: 'IBM Plex Sans Arabic', 'Inter', system-ui, sans-serif !important;
      background-color: var(--bg-canvas) !important;
      color: var(--text-main) !important;
      font-weight: 600 !important;
    }
  </style>
  <script>
    (function() {
      const saved = localStorage.getItem('dajja_theme') || 'light';
      if (saved === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
        document.addEventListener('DOMContentLoaded', () => document.body.classList.add('dark-theme'));
      }
    })();
  </script>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
  <div class="bg-[var(--bg-surface)] border border-[var(--border-stone)] p-8 rounded-3xl max-w-sm w-full text-center shadow-xl">
    <div class="w-16 h-16 mx-auto rounded-2xl bg-[#183B32] border border-[#C5A878]/30 flex items-center justify-center text-3xl shadow-md">
      👑
    </div>
    <h1 class="text-xl font-black mt-4 text-[#183B32]">لوحة تحكم مدير النظام</h1>
    <p class="text-sm text-[var(--text-muted)] font-semibold mt-2">مرحباً بك يا مدير النظام (Super Admin). تم تسجيل دخولك بنجاح!</p>
    <button onclick="logout()" class="mt-6 w-full py-3 bg-[#B93838]/10 hover:bg-[#B93838]/20 text-[#B93838] border border-[#B93838]/25 rounded-xl font-bold transition-all duration-300">تسجيل الخروج 🚪</button>
  </div>
  <script>
    function logout() {
      localStorage.clear();
      window.location.href = '/';
    }
  </script>
</body>
</html>
